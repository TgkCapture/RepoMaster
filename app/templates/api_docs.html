<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Docs | RepoMaster</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    {% include '_theme.html' %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
</head>
<body class="bg-light">
    <div class="container my-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <h1 class="h3 mb-0">RepoMaster API</h1>
            <div class="d-flex gap-2">
                <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary btn-sm">Home</a>
                <a href="{{ url_for('main.api_tokens') }}" class="btn btn-primary btn-sm">API Tokens</a>
                <a href="{{ url_for('api_v1.openapi_spec') }}" class="btn btn-outline-secondary btn-sm">OpenAPI JSON</a>
            </div>
        </div>
        <p class="text-muted small mb-0">
            Read-only JSON API. Create a token on the API Tokens page, then click <strong>Authorize</strong> below
            and paste it to try the endpoints.
        </p>
    </div>
    <div id="swagger-ui" style="background: #fff; color: #3b4151;"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
        window.addEventListener('load', () => {
            SwaggerUIBundle({
                url: {{ url_for('api_v1.openapi_spec')|tojson }},
                dom_id: '#swagger-ui',
                deepLinking: true,
                persistAuthorization: false,
            });
        });
    </script>
</body>
</html>
